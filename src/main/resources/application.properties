server.port=8091
# 봇 시청자 수 (화면에서 100 / 300 / 1000으로 바꿀 수 있다)
live.bots=300
# 캐릭터가 이 간격마다 채팅을 묶어서 보고, 반응할 팬을 고른다
live.tick-ms=3000
# 한 틱에 반응할 팬 수
live.react-k=3
# 채팅창으로 새 채팅을 묶어 보내는 간격 (1000명이 보내도 메시지 수가 폭발하지 않게)
live.chat-flush-ms=500
# 봇이 채팅할지 정하는 간격
live.bot-step-ms=100
# 같은 시드면 같은 봇·같은 채팅이 나온다 (숫자 비교를 재현하려고)
live.seed=42
