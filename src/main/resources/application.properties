server.port=8091
# 봇 시청자 수 (화면에서 100 / 300 / 1000으로 바꿀 수 있다)
live.bots=300
# 캐릭터가 이 간격마다 채팅을 묶어서 보고, 반응할 팬을 고른다
live.tick-ms=3000
# 한 틱에 반응할 팬 수
live.react-k=3
# 채팅창으로 새 채팅을 묶어 보내는 간격 (1000명이 보내도 메시지 수가 폭발하지 않게)
live.chat-flush-ms=500
# 봇이 채팅할지 정하는 간격
live.bot-step-ms=100
# 같은 시드면 같은 봇·같은 채팅이 나온다 (숫자 비교를 재현하려고)
live.seed=42
# 대사 말투 LLM (유료). 기본은 꺼짐 — 켜려면 실행할 때 --live.llm-enabled=true
# 키는 여기 적지 않는다: 환경변수 ANTHROPIC_API_KEY. 켜져 있어도 키가 없으면 템플릿 대사만
live.llm-enabled=false
live.llm-model=claude-haiku-5-5
# 서버를 한 번 켤 때 Haiku 호출 상한 (틱마다 1번). 넘으면 템플릿 대사만 나간다
live.llm-max-calls=300
# 이 시간 안에 LLM 대사가 안 오면 템플릿 대사를 내보낸다
live.llm-timeout-ms=4000
