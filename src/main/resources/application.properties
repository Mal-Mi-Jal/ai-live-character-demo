server.port=8091
# 봇 시청자 수 (화면에서 100 / 300 / 1000으로 바꿀 수 있다)
live.bots=300
# 음성 기준 진행: 한 차례에 한 명 이름 부르기 + 화면에 이름 띄울 인원, 대사 길이만큼 말하고 다음 차례
live.screen-acks=3
# 이 차례마다 한 번은 같은 이야기를 한 여러 명을 한 줄로 알아본다 (묶음 인정, 3명 이상일 때만)
live.group-every=7
# 목소리는 이 시간 안에 온 채팅에만 답한다 (오래된 채팅을 뜬금없이 읽지 않게). 더 오래된 건 화면 ❤·묶음으로
# 시뮬레이션(300명, C): 30초 창 → 읽는 채팅 나이 p50 27.2초, 10초 → 8.3초, 5초 → 4.0초 (도달률은 거의 같음)
live.voice-max-age-ms=5000
# 읽는 속도 (Windows 한국어 음성 Heami 실측, 2026-11-16)
live.voice-chars-per-sec=5.7
# 데모 봇의 후원 확률 배율 (1.0이면 300명일 때 분당 약 18건 → 음성으로 다 못 읽음). 시뮬레이션 테스트는 1.0 그대로
live.bot-gift-scale=0.1
# 채팅창으로 새 채팅을 묶어 보내는 간격 (1000명이 보내도 메시지 수가 폭발하지 않게)
live.chat-flush-ms=500
# 봇이 채팅할지 정하는 간격
live.bot-step-ms=100
# 같은 시드면 같은 봇·같은 채팅이 나온다 (숫자 비교를 재현하려고)
live.seed=42
# 대사 말투 LLM (유료). 기본은 꺼짐 — 켜려면 실행할 때 --live.llm-enabled=true
# 키는 여기 적지 않는다: 환경변수 ANTHROPIC_API_KEY. 켜져 있어도 키가 없으면 템플릿 대사만
live.llm-enabled=false
live.llm-model=claude-haiku-5-5
# 서버를 한 번 켤 때 Haiku 호출 상한 (틱마다 1번). 넘으면 템플릿 대사만 나간다
live.llm-max-calls=300
# 이 시간 안에 LLM 대사가 안 오면 템플릿 대사를 내보낸다
live.llm-timeout-ms=4000
